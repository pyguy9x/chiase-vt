      setSelectedId(id); setSelectedKind('blur'); setActiveTab('blur');
    }, [trimStart, trimEnd, duration, pushHistory]);

    // ── Drag & Resize ────────────────────────────────────────────────────────
    const startDrag = useCallback((e, id, kind, mode) => {
      e.preventDefault(); e.stopPropagation();
      const ovEl = overlayRef.current;
      if (!ovEl) return;
      const rect = ovEl.getBoundingClientRect();

      let origX = 0, origY = 0, origW = 0, origH = 0, elemRef = null;

      if (kind === 'text') {
        const item = texts.find(t => t.id === id); if (!item) return;
        elemRef = txtRefs.current[id];
        origX = item.xPercent / 100 * rect.width; origY = item.yPercent / 100 * rect.height;
        setSelectedId(id); setSelectedKind('text');
      } else if (kind === 'sticker') {
        const item = stickers.find(s => s.id === id); if (!item) return;
        elemRef = stkRefs.current[id];
        origX = item.xPercent / 100 * rect.width; origY = item.yPercent / 100 * rect.height;
        setSelectedId(id); setSelectedKind('sticker');
      } else if (kind === 'vlayer') {
        const item = videoLayers.find(v => v.id === id); if (!item) return;
        elemRef = videoLayerElsRef.current[id];
        origX = (item.xPercent ?? 50) / 100 * rect.width; origY = (item.yPercent ?? 50) / 100 * rect.height;
        origW = ((item.widthPercent || 35) / 100) * rect.width; origH = origW / (item.aspectRatio || (16/9));
        setSelectedId(id); setSelectedKind('vlayer');
      } else if (kind === 'blur') {
        const item = blurs.find(b => b.id === id); if (!item) return;
        elemRef = blurRefs.current[id];
        origX = item.x / 100 * rect.width; origY = item.y / 100 * rect.height;
        origW = item.w / 100 * rect.width; origH = item.h / 100 * rect.height;
        setSelectedId(id); setSelectedKind('blur');
      } else if (kind === 'overlay') {
        const item = overlays.find(o => o.id === id); if (!item) return;
        elemRef = ovRefs.current[id];
        origX = item.x / 100 * rect.width; origY = item.y / 100 * rect.height;
        origW = item.w / 100 * rect.width; origH = item.h / 100 * rect.height;
        setSelectedId(id); setSelectedKind('overlay');
      } else if (kind === 'crop') {
        elemRef = cropRef.current;
        origX = cropBox.x / 100 * rect.width; origY = cropBox.y / 100 * rect.height;
        origW = cropBox.w / 100 * rect.width; origH = cropBox.h / 100 * rect.height;
        setSelectedId('crop'); setSelectedKind('crop');
      }

      dragRef.current = { id, kind, mode, startX: e.clientX, startY: e.clientY, origX, origY, origW, origH, rect, elemRef };

      const onMove = (ev) => {
        if (!dragRef.current) return;
        const d = dragRef.current;
        const dx = ev.clientX - d.startX, dy = ev.clientY - d.startY;
        if (animRef.current) cancelAnimationFrame(animRef.current);
        animRef.current = requestAnimationFrame(() => {
          if (!dragRef.current) return;
          const W = d.rect.width, H = d.rect.height;

          if (d.kind === 'text' || d.kind === 'sticker' || d.kind === 'vlayer') {
            if (d.mode === 'move') {
              let nx = d.origX + dx, ny = d.origY + dy;
              let np = nx / W * 100, nq = ny / H * 100;
              let sx = false, sy = false;
              if (Math.abs(np - 50) < 1.8) { np = 50; sx = true; }
              if (Math.abs(nq - 50) < 1.8) { nq = 50; sy = true; }
              setSnapX(sx); setSnapY(sy);
              if (d.elemRef) { d.elemRef.style.left = np + '%'; d.elemRef.style.top = nq + '%'; }
              d.nextX = np; d.nextY = nq;
            } else if (d.kind === 'vlayer') {
              let nw = d.origW;
              if (d.mode.includes('r')) nw = Math.max(40, d.origW + dx);
              else if (d.mode.includes('l')) nw = Math.max(40, d.origW - dx);
              const nwp = (nw / W) * 100;
              if (d.elemRef) { d.elemRef.style.width = nwp + '%'; }
              d.nextWidthPercent = nwp;
            }

          } else if (d.kind === 'blur' || d.kind === 'overlay') {
            if (d.mode === 'move') {
              let nx = Math.max(0, Math.min(W - d.origW, d.origX + dx));
              let ny = Math.max(0, Math.min(H - d.origH, d.origY + dy));
              if (d.elemRef) { d.elemRef.style.left = nx/W*100+'%'; d.elemRef.style.top = ny/H*100+'%'; }
              d.nextX = nx/W*100; d.nextY = ny/H*100;
            } else {
              let nw = d.origW, nh = d.origH, nx = d.origX, ny = d.origY;
              const MIN = 20;
              if (d.mode.includes('r')) nw = Math.max(MIN, d.origW + dx);
              if (d.mode.includes('b')) nh = Math.max(MIN, d.origH + dy);
              if (d.mode.includes('l')) { nw = Math.max(MIN, d.origW - dx); nx = d.origX + dx; }
              if (d.mode.includes('t')) { nh = Math.max(MIN, d.origH - dy); ny = d.origY + dy; }
              nx = Math.max(0, Math.min(W - nw, nx));
              ny = Math.max(0, Math.min(H - nh, ny));
              if (d.elemRef) {
                d.elemRef.style.left = nx/W*100+'%'; d.elemRef.style.top = ny/H*100+'%';
                d.elemRef.style.width = nw/W*100+'%'; d.elemRef.style.height = nh/H*100+'%';
              }
              d.nextX = nx/W*100; d.nextY = ny/H*100; d.nextW = nw/W*100; d.nextH = nh/H*100;
            }

          } else if (d.kind === 'crop') {
            const ar = aspect === '9:16' ? 9/16 : aspect === '16:9' ? 16/9 : aspect === '1:1' ? 1 : null;
            const MIN = 30;
            if (d.mode === 'move') {
              let nx = Math.max(0, Math.min(W - d.origW, d.origX + dx));
              let ny = Math.max(0, Math.min(H - d.origH, d.origY + dy));
              if (d.elemRef) { d.elemRef.style.left = nx/W*100+'%'; d.elemRef.style.top = ny/H*100+'%'; }
              d.nextX = nx/W*100; d.nextY = ny/H*100;
            } else {
              let nw = d.origW, nh = d.origH, nx = d.origX, ny = d.origY;
              if (d.mode === 'br')      { nw = Math.max(MIN, d.origW + dx); nh = ar ? nw/ar : Math.max(MIN, d.origH + dy); }
              else if (d.mode === 'bl') { nw = Math.max(MIN, d.origW - dx); nx = d.origX+(d.origW-nw); nh = ar ? nw/ar : Math.max(MIN, d.origH + dy); }
              else if (d.mode === 'tr') { nw = Math.max(MIN, d.origW + dx); if (ar) { nh = nw/ar; ny = d.origY+d.origH-nh; } else { nh = Math.max(MIN, d.origH - dy); ny = d.origY+(d.origH-nh); } }
              else if (d.mode === 'tl') { nw = Math.max(MIN, d.origW - dx); nx = d.origX+(d.origW-nw); if (ar) { nh = nw/ar; ny = d.origY+d.origH-nh; } else { nh = Math.max(MIN, d.origH - dy); ny = d.origY+(d.origH-nh); } }
              if (nx < 0)        { nw += nx;   if (ar) nh = nw/ar; nx = 0; }
              if (ny < 0)        { nh += ny;   if (ar) nw = nh*ar; ny = 0; }
              if (nx + nw > W)   { nw = W-nx;  if (ar) nh = nw/ar; }
              if (ny + nh > H)   { nh = H-ny;  if (ar) nw = nh*ar; }
              nw = Math.max(MIN, nw); nh = Math.max(MIN, nh);
              nx = Math.max(0, Math.min(W-nw, nx)); ny = Math.max(0, Math.min(H-nh, ny));
              if (d.elemRef) {
                d.elemRef.style.left = nx/W*100+'%'; d.elemRef.style.top = ny/H*100+'%';
                d.elemRef.style.width = nw/W*100+'%'; d.elemRef.style.height = nh/H*100+'%';
              }
              d.nextX = nx/W*100; d.nextY = ny/H*100; d.nextW = nw/W*100; d.nextH = nh/H*100;
            }
          }
        });
      };

      const onUp = () => {
        if (animRef.current) cancelAnimationFrame(animRef.current);
        const d = dragRef.current;
        if (d && (d.nextX !== undefined || d.nextW !== undefined)) {
          if (d.kind === 'text' && d.nextX !== undefined) {
            pushHistory();
            setTexts(ts => ts.map(t => {
              if (t.id !== d.id) return t;
              const kfIdx = (t.keyframes || []).findIndex(k => Math.abs(k.time - currentTime) < 0.1);
              if (kfIdx !== -1) {
                const nextKfs = [...t.keyframes];
                nextKfs[kfIdx] = { ...nextKfs[kfIdx], x: d.nextX, y: d.nextY };
                return { ...t, keyframes: nextKfs };
              }
              return { ...t, xPercent: d.nextX, yPercent: d.nextY };
            }));
          } else if (d.kind === 'sticker' && d.nextX !== undefined) {
            pushHistory();
            setStickers(ss => ss.map(s => {
              if (s.id !== d.id) return s;
              const kfIdx = (s.keyframes || []).findIndex(k => Math.abs(k.time - currentTime) < 0.1);
              if (kfIdx !== -1) {
                const nextKfs = [...s.keyframes];
                nextKfs[kfIdx] = { ...nextKfs[kfIdx], x: d.nextX, y: d.nextY };
                return { ...s, keyframes: nextKfs };
              }
              return { ...s, xPercent: d.nextX, yPercent: d.nextY };
            }));
          } else if (d.kind === 'vlayer' && (d.nextX !== undefined || d.nextWidthPercent !== undefined)) {
            pushHistory();
            setVideoLayers(vs => vs.map(v => {
              if (v.id !== d.id) return v;
              let nextV = { ...v };
              if (d.nextWidthPercent !== undefined) nextV.widthPercent = d.nextWidthPercent;
              if (d.nextX !== undefined) {
                const kfIdx = (v.keyframes || []).findIndex(k => Math.abs(k.time - currentTime) < 0.1);
                if (kfIdx !== -1) {
                  const nextKfs = [...v.keyframes];
                  nextKfs[kfIdx] = { ...nextKfs[kfIdx], x: d.nextX, y: d.nextY };
                  nextV.keyframes = nextKfs;
                } else {
                  nextV.xPercent = d.nextX;
                  nextV.yPercent = d.nextY;
                }
              }
              return nextV;
            }));
          } else if (d.kind === 'blur') {
            pushHistory();
            setBlurs(bs => bs.map(b => b.id !== d.id ? b : d.nextW !== undefined ? { ...b, x: d.nextX, y: d.nextY, w: d.nextW, h: d.nextH } : { ...b, x: d.nextX, y: d.nextY }));
          } else if (d.kind === 'overlay') {
            pushHistory();
            setOverlays(os => os.map(o => o.id !== d.id ? o : d.nextW !== undefined ? { ...o, x: d.nextX, y: d.nextY, w: d.nextW, h: d.nextH } : { ...o, x: d.nextX, y: d.nextY }));
          } else if (d.kind === 'crop') {
            if (d.nextW !== undefined) setCropBox({ x: d.nextX, y: d.nextY, w: d.nextW, h: d.nextH });
            else setCropBox(c => ({ ...c, x: d.nextX, y: d.nextY }));
          }
        }
        setSnapX(false); setSnapY(false);
        dragRef.current = null;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }, [texts, stickers, videoLayers, blurs, overlays, cropBox, aspect, currentTime, pushHistory]);

    // ── Trim Drag ────────────────────────────────────────────────────────────
    const startTrimDrag = useCallback((e, handle) => {
      e.preventDefault(); e.stopPropagation();
      if (duration === 0) return;
      const targetEl = e.currentTarget.classList.contains('track-bg')
        ? e.currentTarget
        : (e.currentTarget.querySelector?.('.track-bg') || (timelineRef.current ? timelineRef.current.querySelector('.track-bg') : e.currentTarget));
      const rect = (targetEl || e.currentTarget).getBoundingClientRect();
      setDragHandle(handle);
      trimDragRef.current = { handle, rect };

      const onMove = (ev) => {
        if (!trimDragRef.current) return;
        const frac = Math.max(0, Math.min(1, (ev.clientX - trimDragRef.current.rect.left) / trimDragRef.current.rect.width));
        const t = frac * duration;
        if (handle === 'start') {
          const ns = Math.max(0, Math.min(t, trimEnd - 0.15));
          setTrimStart(ns);
          if (currentTime < ns && videoRef.current) { setCurrentTime(ns); videoRef.current.currentTime = ns; }
        } else if (handle === 'end') {
          const ne = Math.max(trimStart + 0.15, Math.min(t, duration));
          setTrimEnd(ne);
          if (currentTime > ne && videoRef.current) { const ct = ne - 0.05; setCurrentTime(ct); videoRef.current.currentTime = ct; }
        } else if (handle === 'playhead') {
          let np = Math.max(trimStart, Math.min(t, trimEnd));
          const snapTargets = [trimStart, trimEnd, ...layerItems.flatMap(x => [x.start, x.end]), ...markers.map(m => m.time)];
          const threshold = Math.max(0.08, (8 / trimDragRef.current.rect.width) * duration);
          for (const target of snapTargets) {
            if (Math.abs(np - target) < threshold) {
              np = target;
              break;
            }
          }
          setCurrentTime(np);
          if (videoRef.current) videoRef.current.currentTime = np;
        }
      };
      const onUp = () => {
        setDragHandle(null);
        trimDragRef.current = null;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }, [duration, trimStart, trimEnd, currentTime, layerItems, markers]);

    // ── Layer Playhead Scrub Drag ────────────────────────────────────────────
    const startLayerPlayheadDrag = useCallback((e) => {
      e.preventDefault(); e.stopPropagation();
      if (!layerTrackRef.current || trimDuration <= 0) return;
      const rect = layerTrackRef.current.getBoundingClientRect();
      const calcTime = (clientX) => {
        const frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        let t = trimStart + frac * trimDuration;
        const snapTargets = [trimStart, trimEnd, ...layerItems.flatMap(x => [x.start, x.end]), ...markers.map(m => m.time)];
        const threshold = Math.max(0.08, (8 / rect.width) * trimDuration);
        for (const target of snapTargets) {
          if (Math.abs(t - target) < threshold) {
            t = target;
            break;
          }
        }
        return Math.max(trimStart, Math.min(t, trimEnd));
      };
      const t = calcTime(e.clientX);
      setCurrentTime(t);
      if (videoRef.current) videoRef.current.currentTime = t;

      const onMove = (ev) => {
        const nt = calcTime(ev.clientX);
        setCurrentTime(nt);
        if (videoRef.current) videoRef.current.currentTime = nt;
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }, [trimStart, trimEnd, trimDuration, layerItems, markers]);

    // ── Layer Timeline Drag ──────────────────────────────────────────────────
    const startLayerDrag = useCallback((e, id, kind, mode) => {
      e.preventDefault(); e.stopPropagation();
      if (!layerTrackRef.current) return;
      const rect = layerTrackRef.current.getBoundingClientRect();
      setSelectedId(id); setSelectedKind(kind);
      if (kind === 'text') setActiveTab('text');
      else if (kind === 'sticker') setActiveTab('sticker');
      else if (kind === 'vlayer') setActiveTab('vlayer');
      else if (kind === 'blur') setActiveTab('blur');
      else if (kind === 'overlay') setActiveTab('overlay');
      else if (kind === 'audio') setActiveTab('audio');

      const arr = kind === 'text' ? texts : kind === 'sticker' ? stickers : kind === 'vlayer' ? videoLayers : kind === 'blur' ? blurs : kind === 'overlay' ? overlays : audios;
      const item = arr.find(x => x.id === id); if (!item) return;

      layerDragRef.current = { id, kind, mode, startX: e.clientX, origStart: item.start, origEnd: item.end, trackWidth: rect.width, trimStart, trimDuration };

      const onMove = (ev) => {
        const d = layerDragRef.current; if (!d) return;
        const delta = (ev.clientX - d.startX) / d.trackWidth * d.trimDuration;
        if (layerAnimRef.current) cancelAnimationFrame(layerAnimRef.current);
        layerAnimRef.current = requestAnimationFrame(() => {
          if (!layerDragRef.current) return;
          const { origStart: os, origEnd: oe, mode: m, trimStart: ts, trimDuration: td } = layerDragRef.current;
          const MIN = 0.2;
          const te = ts + td;

          const snapTargets = [
            currentTime,
            ts,
            te,
            ...layerItems.filter(x => x.id !== id).flatMap(x => [x.start, x.end]),
            ...markers.map(m => m.time)
          ];
          const snapThreshold = Math.max(0.08, (10 / d.trackWidth) * td);

          let ns = os, ne = oe;
          let activeSnap = null;

          if (m === 'move') {
            const dur = oe - os;
            const rawStart = os + delta;
            const rawEnd = rawStart + dur;

            let bestSnap = null;
            let minDiff = snapThreshold;
            let candidateStart = rawStart;

            for (const target of snapTargets) {
              const diff = Math.abs(rawStart - target);
              if (diff < minDiff) {
                minDiff = diff;
                bestSnap = target;
                candidateStart = target;
              }
            }

            if (bestSnap === null) {
              for (const target of snapTargets) {
                const diff = Math.abs(rawEnd - target);
                if (diff < minDiff) {
                  minDiff = diff;
                  bestSnap = target;
                  candidateStart = target - dur;
                }
              }
            }

            if (bestSnap !== null) {
              ns = candidateStart;
              ne = ns + dur;
              activeSnap = bestSnap;
            } else {
              ns = rawStart;
              ne = rawEnd;
            }

            if (ns < ts) { ns = ts; ne = ns + dur; }
            if (ne > te) { ne = te; ns = ne - dur; }
          } else if (m === 'resize-left') {
            const rawStart = os + delta;
            let bestSnap = null;
            let minDiff = snapThreshold;
            let candidateStart = rawStart;

            for (const target of snapTargets) {
              const diff = Math.abs(rawStart - target);
              if (diff < minDiff && target <= oe - MIN) {
                minDiff = diff;
                bestSnap = target;
                candidateStart = target;
              }
            }

            if (bestSnap !== null) {
              ns = candidateStart;
              activeSnap = bestSnap;
            } else {
              ns = rawStart;
            }

            ns = Math.min(oe - MIN, Math.max(ts, ns));
            ne = oe;
          } else {
            // resize or resize-right
            const rawEnd = oe + delta;
            let bestSnap = null;
            let minDiff = snapThreshold;
            let candidateEnd = rawEnd;

            for (const target of snapTargets) {
              const diff = Math.abs(rawEnd - target);
              if (diff < minDiff && target >= os + MIN) {
                minDiff = diff;
                bestSnap = target;
                candidateEnd = target;
              }
            }

            if (bestSnap !== null) {
              ne = candidateEnd;
              activeSnap = bestSnap;
            } else {
              ne = rawEnd;
            }

            ne = Math.max(os + MIN, Math.min(te, ne));
            ns = os;
          }

          setTimelineSnapTime(activeSnap);

          const upd = list => list.map(x => x.id === id ? { ...x, start: ns, end: ne } : x);
          if (kind === 'text')         setTexts(upd);
          else if (kind === 'sticker') setStickers(upd);
          else if (kind === 'vlayer')  setVideoLayers(upd);
          else if (kind === 'blur')    setBlurs(upd);
          else if (kind === 'overlay') setOverlays(upd);
          else if (kind === 'audio')   setAudios(upd);
        });
      };
      const onUp = () => {
        if (layerAnimRef.current) cancelAnimationFrame(layerAnimRef.current);
        layerDragRef.current = null;
        setTimelineSnapTime(null);
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }, [texts, stickers, videoLayers, blurs, overlays, audios, trimStart, trimDuration, currentTime, layerItems, markers]);

    const onBgClick = useCallback((e) => {
      const t = e.target;
      if (t === wrapRef.current || t === overlayRef.current || t === containerRef.current || t === videoRef.current || t.classList.contains('preview-bg')) {
        setSelectedId(null); setSelectedKind(null);
      }
    }, []);

    const toggleFullscreen = async () => {
      try {
        if (!document.fullscreenElement && !isFullscreen) {
          if (wrapRef.current?.requestFullscreen) {
            await wrapRef.current.requestFullscreen();
          } else {
            setIsFullscreen(true);
          }
        } else {
          if (document.fullscreenElement && document.exitFullscreen) {
            await document.exitFullscreen();
          } else {
            setIsFullscreen(false);
          }
        }
      } catch (err) {
        setIsFullscreen(f => !f);
      }
    };


    // ── Export Video With Audio Mixing ────────────────────────────────────────
    const exportWithCanvas = useCallback(async (outSize) => {
      const video = videoRef.current;
      if (!video) throw new Error('no video');
      const canvas = document.createElement('canvas');
      canvas.width = outSize.w; canvas.height = outSize.h;
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('no ctx');

      const stream = canvas.captureStream(30);

      // Setup AudioContext for mixing video original audio + all background MP3 audios
      let activeAudioEls = [];
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          if (audioCtxRef.current?.state === 'closed' || !audioCtxRef.current) {
            audioCtxRef.current = new AudioCtx();
          }
          const actx = audioCtxRef.current;
          if (actx.state === 'suspended') await actx.resume();
          const dest = actx.createMediaStreamDestination();

          // 1. Original Video Audio
          if (!videoSourceNode.current) {
            videoSourceNode.current = actx.createMediaElementSource(video);
          }
          const videoGain = actx.createGain();
          videoGain.gain.value = videoVolume;
          videoSourceNode.current.connect(videoGain);
          videoGain.connect(dest);
          videoGain.connect(actx.destination);

          // 2. Extra BGM Audios
          audios.forEach(aud => {
            const audEl = new Audio(aud.src);
            audEl.currentTime = Math.max(0, (trimStart - aud.start) + (aud.offset || 0));
            const audSource = actx.createMediaElementSource(audEl);
            const audGain = actx.createGain();
            audGain.gain.value = aud.volume ?? 1;
            audSource.connect(audGain);
            audGain.connect(dest);
            audGain.connect(actx.destination);
            activeAudioEls.push({ el: audEl, start: aud.start, end: aud.end, offset: aud.offset || 0 });
          });

          // 3. PIP Video Layers Audio
          videoLayers.forEach(vl => {
            const pipEl = videoLayerElsRef.current[vl.id];
            if (pipEl && !vl.muted && (vl.volume || 1) > 0) {
              try {
                const pipSource = actx.createMediaElementSource(pipEl);
                const pipGain = actx.createGain();
                pipGain.gain.value = vl.volume ?? 1;
                pipSource.connect(pipGain);
                pipGain.connect(dest);
                pipGain.connect(actx.destination);
              } catch (e) {
                console.warn('PIP audio setup warning:', e);
              }
            }
          });

          dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
        }
      } catch (err) {
        console.warn('Audio mixing setup warning:', err);
      }

      // Check format support
      let mimeType = 'video/webm';
      let fileExt = 'webm';

      if (exportFormat === 'mp4') {
        const mp4Candidates = [
          'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
          'video/mp4;codecs=avc1',
          'video/mp4;codecs=h264',
          'video/mp4'
        ];
        const match = mp4Candidates.find(t => typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t));
        if (match) {
          mimeType = match;
          fileExt = 'mp4';
        } else {
          showToast('Trình duyệt không hỗ trợ encoder MP4 trực tiếp, tự động chuyển WebM');
          const webmCandidates = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp9', 'video/webm'];
          mimeType = webmCandidates.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
          fileExt = 'webm';
        }
      } else {
        const webmCandidates = [
          'video/webm;codecs=vp9,opus',
          'video/webm;codecs=vp9',
          'video/webm;codecs=vp8,opus',
          'video/webm'
        ];
        mimeType = webmCandidates.find(t => typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) || 'video/webm';
        fileExt = 'webm';
      }

      const chunks = [];
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
      const targetDuration = Math.max(0.1, trimEnd - trimStart);

      return new Promise((resolve, reject) => {
        let isStopped = false;
        let safetyTimer = null;
        let recordStartTime = 0;

        const stopExport = () => {
          if (isStopped) return;
          isStopped = true;
          if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
          try {
            if (recorder && recorder.state !== 'inactive') {
              recorder.stop();
            }
          } catch (e) {
            console.warn('recorder stop warning:', e);
          }
          try { video.pause(); } catch {}
          activeAudioEls.forEach(item => {
            try { item.el.pause(); item.el.src = ''; } catch {}
          });
          setProgress(100);
        };

        recorder.ondataavailable = ev => { if (ev.data.size > 0) chunks.push(ev.data); };
        recorder.onerror = (err) => {
          if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
          reject(err);
        };
        recorder.onstop = () => {
          if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
          activeAudioEls.forEach(item => {
            try { item.el.pause(); item.el.src = ''; } catch {}
          });
          video.currentTime = trimStart;
          setCurrentTime(trimStart);
          const blob = new Blob(chunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `cliplite_${Date.now()}.${fileExt}`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          showToast(`Đã xuất video .${fileExt.toUpperCase()} (${targetDuration.toFixed(1)}s) thành công!`);
          resolve();
        };

        video.muted = false;

        const onSeeked = () => {
          recordStartTime = performance.now();
          safetyTimer = setTimeout(() => {
            if (!isStopped) {
              console.warn('Safety timeout reached for export');
              stopExport();
            }
          }, (targetDuration + 1.2) * 1000);

          try {
            recorder.start(100);
          } catch (e) {
            reject(e);
            return;
          }

          video.play().catch(reject);

          // Start playing BGM audio elements if within range
          activeAudioEls.forEach(item => {
            if (video.currentTime >= item.start && video.currentTime <= item.end) {
              item.el.currentTime = Math.max(0, (video.currentTime - item.start) + (item.offset || 0));
              item.el.play().catch(() => {});
            }
          });

          const useRVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;

          // Crop parameters in %
          const cx = cropEnabled ? cropBox.x : 0;
          const cy = cropEnabled ? cropBox.y : 0;
          const cw = cropEnabled ? Math.max(0.1, cropBox.w) : 100;
          const ch = cropEnabled ? Math.max(0.1, cropBox.h) : 100;

          const previewW = (overlayRef.current && overlayRef.current.clientWidth)
            || (videoRef.current && videoRef.current.clientWidth)
            || (containerRef.current && containerRef.current.clientWidth)
            || 360;
          const cropPreviewW = previewW * (cw / 100);
          const textScale = canvas.width / Math.max(1, cropPreviewW);

          const drawFrame = () => {
            if (isStopped) return;
            const elapsedSec = (performance.now() - recordStartTime) / 1000;
            if (video.currentTime >= (trimEnd - 0.04) || video.ended || elapsedSec >= (targetDuration + 0.15)) {
              stopExport();
              return;
            }

            // Sync BGM elements playback
            activeAudioEls.forEach(item => {
              const inRange = video.currentTime >= item.start && video.currentTime <= item.end;
              if (inRange && item.el.paused) {
                item.el.currentTime = Math.max(0, (video.currentTime - item.start) + (item.offset || 0));
                item.el.play().catch(() => {});
              } else if (!inRange && !item.el.paused) {
                item.el.pause();
              }
            });

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const sx = (cx / 100) * video.videoWidth;
            const sy = (cy / 100) * video.videoHeight;
            const sw = (cw / 100) * video.videoWidth;
            const sh = (ch / 100) * video.videoHeight;
            try { ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height); } catch {}

            // Overlays mapped to crop box
            overlays.forEach(ov => {
              if (video.currentTime < ov.start || video.currentTime > ov.end) return;
              const cur = getInterpolatedLayer(ov, video.currentTime);
              if (cur.effectiveOpacity <= 0) return;

              const x = ((cur.x - cx) / cw) * canvas.width;
              const y = ((cur.y - cy) / ch) * canvas.height;
              const w = (ov.w / cw) * canvas.width * (cur.scale || 1);
              const hh = (ov.h / ch) * canvas.height * (cur.scale || 1);

              ctx.save();
              ctx.beginPath();
              ctx.rect(0, 0, canvas.width, canvas.height);
              ctx.clip();
              ctx.globalAlpha = cur.effectiveOpacity;
              if (cur.rotation) {
                ctx.translate(x + w / 2, y + hh / 2);
                ctx.rotate((cur.rotation * Math.PI) / 180);
                ctx.translate(-(x + w / 2), -(y + hh / 2));
              }
              if (ov.type === 'color' && ov.color) {
                ctx.fillStyle = ov.color; ctx.fillRect(x, y, w, hh);
              } else if (ov.type === 'image') {
                const img = imgCacheRef.current[ov.id];
                if (img && img.complete && img.naturalWidth > 0) {
                  try { ctx.drawImage(img, x, y, w, hh); } catch {}
                } else {
                  ctx.fillStyle = '#444'; ctx.fillRect(x, y, w, hh);
                }
              }
              ctx.restore();
            });

            // PIP Video Layers mapped to crop box
            videoLayers.forEach(vl => {
              if (video.currentTime < vl.start || video.currentTime > vl.end) return;
              const cur = getInterpolatedLayer(vl, video.currentTime);
              if (cur.effectiveOpacity <= 0) return;
              const el = videoLayerElsRef.current[vl.id];
              if (!el) return;

              const vx = ((cur.x - cx) / cw) * canvas.width;
              const vy = ((cur.y - cy) / ch) * canvas.height;
              const w = ((vl.widthPercent || 35) / cw) * canvas.width * (cur.scale || 1);
              const h = w / (vl.aspectRatio || (16/9));

              ctx.save();
              ctx.beginPath();
              ctx.rect(0, 0, canvas.width, canvas.height);
              ctx.clip();
              ctx.translate(vx, vy);
              if (cur.rotation) ctx.rotate((cur.rotation * Math.PI) / 180);
              ctx.globalAlpha = cur.effectiveOpacity;
              try {
                ctx.drawImage(el, -w / 2, -h / 2, w, h);
              } catch {}
              ctx.restore();
            });

            // Blurs mapped to crop box (hỗ trợ rect bo góc, circle, polygon)
            blurs.forEach(bl => {
              if (video.currentTime < bl.start || video.currentTime > bl.end) return;
              const bx = ((bl.x - cx) / cw) * canvas.width;
              const by = ((bl.y - cy) / ch) * canvas.height;
              const bw = (bl.w / cw) * canvas.width;
              const bh = (bl.h / ch) * canvas.height;

              const createBlurPath = () => {
                ctx.beginPath();
                if (bl.shape === 'circle') {
                  ctx.ellipse(bx + bw / 2, by + bh / 2, Math.max(1, bw / 2), Math.max(1, bh / 2), 0, 0, Math.PI * 2);
                } else if (bl.shape === 'polygon') {
                  const pts = getPolygonPoints(bl.polygonType || 'diamond', bx, by, bw, bh);
                  if (pts.length > 0) {
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.closePath();
                  } else {
                    ctx.rect(bx, by, bw, bh);
                  }
                } else {
                  if (bl.borderRadius && ctx.roundRect) {
                    const r = Math.min(bw / 2, bh / 2, (bl.borderRadius / previewW) * canvas.width);
                    ctx.roundRect(bx, by, bw, bh, Math.max(0, r));
                  } else {
                    ctx.rect(Math.max(0, bx), Math.max(0, by), Math.min(canvas.width, bw), Math.min(canvas.height, bh));
                  }
                }
              };

              ctx.save();
              createBlurPath();
              ctx.clip();
              const scaledBlur = Math.max(2, Math.round(blurPx * textScale));
              ctx.filter = `blur(${scaledBlur}px)`;
              try { ctx.drawImage(canvas, 0, 0); } catch {}
              ctx.restore();

              ctx.save();
              createBlurPath();
              ctx.clip();
              ctx.fillStyle = 'rgba(255,255,255,0.08)';
              ctx.fill();
              ctx.restore();
            });

            // Stickers mapped to crop box
            stickers.forEach(stk => {
              if (video.currentTime < stk.start || video.currentTime > stk.end) return;
              const cur = getInterpolatedLayer(stk, video.currentTime);
              if (cur.effectiveOpacity <= 0) return;

              const sx = ((cur.x - cx) / cw) * canvas.width;
              const sy = ((cur.y - cy) / ch) * canvas.height;
              const sz = Math.max(12, Math.round(stk.size * textScale * (cur.scale || 1)));

              ctx.save();
              ctx.beginPath();
              ctx.rect(0, 0, canvas.width, canvas.height);
              ctx.clip();
              ctx.globalAlpha = cur.effectiveOpacity;
              ctx.translate(sx, sy);
              if (cur.rotation) ctx.rotate((cur.rotation * Math.PI) / 180);
              ctx.font = `${sz}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(stk.content, 0, 0);
              ctx.restore();
            });

            // Texts mapped to crop box
            texts.forEach(txt => {
              if (video.currentTime < txt.start || video.currentTime > txt.end) return;
              const cur = getInterpolatedLayer(txt, video.currentTime);
              if (cur.effectiveOpacity <= 0) return;

              const tx = ((cur.x - cx) / cw) * canvas.width;
              const ty = ((cur.y - cy) / ch) * canvas.height;
              const fs = Math.max(10, Math.round(txt.fontSize * textScale * (cur.scale || 1)));
              const ff = txt.fontFamily || 'Inter';

              ctx.save();
              ctx.beginPath();
              ctx.rect(0, 0, canvas.width, canvas.height);
              ctx.clip();
              ctx.globalAlpha = cur.effectiveOpacity;
              ctx.translate(tx, ty);
              if (cur.rotation) ctx.rotate((cur.rotation * Math.PI) / 180);
              ctx.font = `${txt.bold?'700':'400'} ${fs}px "${ff}", sans-serif`;
              ctx.fillStyle = txt.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = Math.round(8 * textScale); ctx.shadowOffsetY = Math.round(2 * textScale);
              ctx.fillText(txt.content, 0, 0);
              ctx.restore();
            });

            const pct = Math.min(99, Math.max(0, (elapsedSec / targetDuration) * 100));
            setProgress(pct);

            if (useRVFC) video.requestVideoFrameCallback(drawFrame);
            else requestAnimationFrame(drawFrame);
          };

          if (useRVFC) video.requestVideoFrameCallback(drawFrame);
          else requestAnimationFrame(drawFrame);
        };

        if (Math.abs(video.currentTime - trimStart) < 0.04) {
          onSeeked();
        } else {
          let seekHandled = false;
          const handleSeek = () => {
            if (seekHandled) return;
            seekHandled = true;
            video.removeEventListener('seeked', handleSeek);
            onSeeked();
          };
          video.addEventListener('seeked', handleSeek);
          video.currentTime = trimStart;
          setTimeout(() => {
            if (!seekHandled) {
              seekHandled = true;
              video.removeEventListener('seeked', handleSeek);
              onSeeked();
            }
          }, 400);
        }
      });
    }, [trimStart, trimEnd, cropEnabled, cropBox, overlays, blurs, texts, stickers, videoLayers, audios, videoVolume, blurPx, exportFormat, showToast]);

    const doExport = useCallback(async () => {
      if (!videoRef.current || !videoSrc) { alert('Vui lòng nhập video trước'); return; }
      const outSize = getOutputSize(aspect);
      exportingRef.current = true;
      setExporting(true); setProgress(1);
      try {
        await exportWithCanvas(outSize);
      } catch (err) {
        console.error(err); alert('Xuất lỗi: ' + (err?.message || err));
      } finally {
        exportingRef.current = false;
        setExporting(false); setProgress(0);
      }
    }, [videoSrc, aspect, getOutputSize, exportWithCanvas]);

    // ── Resize handle helper ───────────────────────────────────────────────────
    const resizeHandle = (kind, id, pos, cursor, color) => {
      if (isFullscreen) return null;
      return h('div', {
        key: pos,
        className: `absolute w-3 h-3 rounded-[2px] ${cursor}`,
        style: {
          background: color,
          ...(pos.includes('t') ? { top: '-6px' } : { bottom: '-6px' }),
          ...(pos.includes('l') ? { left: '-6px' } : { right: '-6px' }),
        },
        onPointerDown: (e) => startDrag(e, id, kind, pos),
      });
    };

    // ── Keyframe & Fade Control UI Helpers ─────────────────────────────────────
    const renderKeyframeControl = (item, kind) => {

                  playsInline: true,
                  muted,
                  onLoadedMetadata: (e) => {

                    setTimeout(syncSize, 50);

                  onTimeUpdate: (e) => {
                    if (exportingRef.current) return;

                    if (trimEnd > trimStart) {

                  // Text layers
                  texts.map(txt => {

                        left: `${cur.x}%`, top: `${cur.y}%`, width: `${ov.w}%`, height: `${ov.h}%`,

                        opacity: visible ? cur.effectiveOpacity : 0.2,

                      onPointerDown: isFullscreen ? undefined : e => startDrag(e, ov.id, 'overlay', 'move'),

                      h('video', {
                        ref: el => { if (el) videoLayerElsRef.current[vl.id] = el; },

                  // Blur layers (hỗ trợ rect bo góc, circle/elip, polygon/path)

                        h('div', { className: 'text-[10px] text-zinc-500' }, fmt(a.start), ' → ', fmt(a.end), ' • Âm lượng ', Math.round((a.volume ?? 1) * 100), '%'),
                      ),
                      h('button', {
                        onClick: (e) => { e.stopPropagation(); removeAudio(a.id); },
                        className: 'w-6 h-6 rounded bg-zinc-800 hover:bg-zinc-700 flex items-center justify-center text-zinc-400 hover:text-white',
                      }, '✕'),
                    ),
                  ),
                ),

                // Chỉnh sửa layer audio đang chọn
                selectedAudio && h('div', { className: 'bg-zinc-900 p-3.5 rounded-xl border border-zinc-800 space-y-3' },
                  h('div', { className: 'text-[11px] uppercase tracking-widest text-emerald-400 font-bold truncate' }, 'Chỉnh: ', selectedAudio.name),
                  h('label', { className: 'block space-y-1' },
                    h('div', { className: 'flex justify-between text-[11px] text-zinc-400' },
                      h('span', {}, 'Âm lượng nhạc (hỗ trợ boost đến 200%)'),
                      h('span', { className: 'text-emerald-400 font-mono font-bold' }, Math.round((selectedAudio.volume ?? 1) * 100), '%'),
                    ),
                    h('input', {
                      type: 'range', min: 0, max: 200, value: Math.round((selectedAudio.volume ?? 1) * 100),
                      onChange: e => setAudios(as => as.map(x => x.id === selectedAudio.id ? { ...x, volume: parseInt(e.target.value) / 100 } : x)),
                      className: 'w-full accent-emerald-400',
                    }),
                  ),
                  h('div', { className: 'text-[11px] text-zinc-500' },
                    'Kéo thanh màu xanh ở Layers timeline để đổi thời điểm phát và độ dài bài hát.'
                  ),
                ),
              ),
            ),
          ),

          // Status bar
          h('div', { className: 'p-3 border-t border-zinc-800 bg-[#141414] text-[11px] text-zinc-500' },
            h('div', { className: 'flex justify-between' }, h('span', {}, 'Output'), h('span', { className: 'text-zinc-300' }, videoSrc ? `${outSize.w}x${outSize.h}` : '--')),
            h('div', { className: 'flex justify-between mt-1' }, h('span', {}, 'Layers'), h('span', { className: 'text-zinc-300' }, texts.length + stickers.length + videoLayers.length + blurs.length + overlays.length + audios.length, ' layers')),
            h('div', { className: 'flex justify-between mt-1' }, h('span', {}, 'Loop Trim'), h('span', { className: 'text-[#a855f7]' }, videoSrc ? `${fmt(trimStart)}→${fmt(trimEnd)}` : '--')),
            h('div', { className: 'flex justify-between mt-1' }, h('span', {}, 'Undo'), h('span', { className: 'text-zinc-400' }, historyRef.current.length, ' states • Ctrl+Z')),
          ),
        ),
      ),

      // ── Export modal ───────────────────────────────────────────────────────
      exporting && h('div', { className: 'fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4' },
        h('div', { className: 'bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-[380px] shadow-2xl' },
          h('div', { className: 'flex items-center gap-2 mb-2' },
            h('span', { className: 'text-lg animate-pulse' }, '⚡'),
            h('h3', { className: 'text-base font-bold' }, `Đang xuất ${exportFormat.toUpperCase()}...`),
          ),
          h('p', { className: 'text-[12px] text-zinc-300 mb-1' },
            'Thời lượng xuất: ', h('span', { className: 'text-[#a855f7] font-bold font-mono' }, `${(trimEnd - trimStart || 0).toFixed(1)}s`),
            ' (', fmt(trimStart), ' → ', fmt(trimEnd), ')'
          ),
          h('p', { className: 'text-[11px] text-zinc-400 mb-4' }, 'Canvas ', outSize.w, 'x', outSize.h, (cropEnabled ? ' • Trong vùng Crop' : ' • Toàn khung'), ' • Hòa âm video + MP3'),
          h('div', { className: 'h-2.5 bg-zinc-800 rounded-full overflow-hidden' },
            h('div', { className: 'h-full bg-gradient-to-r from-[#a855f7] to-pink-500 transition-all duration-150', style: { width: `${progress}%` } }),
          ),
          h('div', { className: 'flex justify-between mt-2 text-[12px] font-mono' },
            h('span', { className: 'text-zinc-500' }, progress.toFixed(1), '%'),
            h('span', { className: 'text-zinc-400' }, fmt(trimStart + (trimEnd - trimStart) * (progress / 100)), ' / ', fmt(trimEnd)),
          ),
          h('div', { className: 'mt-4 text-[11px] text-zinc-500 leading-relaxed' }, 'Đang ghi hình chính xác đoạn cắt và hoàn thiện file...'),
        ),
      ),

      // ── Toast notification ─────────────────────────────────────────────────
      toast && h('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] bg-white text-black text-[13px] font-medium px-4 py-2.5 rounded-full shadow-xl border border-zinc-200 anim-fadein' }, toast),
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(h(React.StrictMode, null, h(ClipLiteApp, null)));

})();
</script>
</body>
</html>
