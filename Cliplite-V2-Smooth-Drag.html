<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipLite V3 — Video & Audio Editor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Pacifico&family=Playfair+Display:wght@700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    body { margin: 0; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    #root, body, html { min-height: 100%; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 99px; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    .anim-fadein { animation: fadeIn 0.2s ease; }
    input[type=range] { cursor: pointer; }
    input[type=color] { cursor: pointer; }
    .will-change-transform { will-change: transform; }
    /* snap guide lines */
    .snap-x { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #a855f7; pointer-events: none; z-index: 20; opacity: 0.8; }
    .snap-y { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #a855f7; pointer-events: none; z-index: 20; opacity: 0.8; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';
  const { useState, useEffect, useRef, useMemo, useCallback } = React;
  const h = React.createElement;

  /* =========================================================
     Helper: Encode AudioBuffer to WAV Blob
     ========================================================= */
  function audioBufferToWav(buffer, optStart = 0, optDuration = null) {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const format = 1; // PCM
    const bitDepth = 16;
    
    let startSample = Math.max(0, Math.floor(optStart * sampleRate));
    let numSamples = optDuration != null 
      ? Math.min(buffer.length - startSample, Math.floor(optDuration * sampleRate)) 
      : (buffer.length - startSample);
    numSamples = Math.max(0, numSamples);

    const bytesPerSample = bitDepth / 8;
    const blockAlign = numChannels * bytesPerSample;
    const dataSize = numSamples * blockAlign;
    const bufferSize = 44 + dataSize;
    const arrayBuffer = new ArrayBuffer(bufferSize);
    const view = new DataView(arrayBuffer);

    function writeString(offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, format, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitDepth, true);
    writeString(36, 'data');
    view.setUint32(40, dataSize, true);

    let offset = 44;
    const channels = [];
    for (let c = 0; c < numChannels; c++) {
      channels.push(buffer.getChannelData(c));
    }

    for (let i = 0; i < numSamples; i++) {
      for (let c = 0; c < numChannels; c++) {
        let sample = channels[c][startSample + i];
        sample = Math.max(-1, Math.min(1, sample));
        let intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
        view.setInt16(offset, intSample, true);
        offset += 2;
      }
    }
    return new Blob([arrayBuffer], { type: 'audio/wav' });
  }

  /* =========================================================
     Helper: Get Polygon Points for Custom Blur Shapes
     ========================================================= */
  function getPolygonPoints(type, x = 0, y = 0, w = 100, h = 100) {
    if (type === 'diamond') {
      return [
        { x: x + w * 0.5, y: y },
        { x: x + w,       y: y + h * 0.5 },
        { x: x + w * 0.5, y: y + h },
        { x: x,           y: y + h * 0.5 }
      ];
    }
    if (type === 'triangle') {
      return [
        { x: x + w * 0.5, y: y },
        { x: x + w,       y: y + h },
        { x: x,           y: y + h }
      ];
    }
    if (type === 'hexagon') {
      return [
        { x: x + w * 0.25, y: y },
        { x: x + w * 0.75, y: y },
        { x: x + w,        y: y + h * 0.5 },
        { x: x + w * 0.75, y: y + h },
        { x: x + w * 0.25, y: y + h },
        { x: x,            y: y + h * 0.5 }
      ];
    }
    if (type === 'star') {
      const pts = [];
      const cx = x + w / 2, cy = y + h / 2, rOut = Math.min(w, h) / 2, rIn = rOut * 0.45;
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? rOut : rIn;
        const a = (i * Math.PI) / 5 - Math.PI / 2;
        pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
      }
      return pts;
    }
    return [
      { x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }
    ];
  }

  function ClipLiteApp() {

    // ── Refs ─────────────────────────────────────────────────────────────────
    const videoRef         = useRef(null);
    const wrapRef          = useRef(null);
    const overlayRef       = useRef(null);
    const containerRef     = useRef(null);
    const timelineRef      = useRef(null);
    const layerTrackRef    = useRef(null);
    const videoInputRef    = useRef(null);
    const videoLayerInputRef = useRef(null);
    const imgInputRef      = useRef(null);
    const audioInputRef    = useRef(null);
    const projectInputRef  = useRef(null);
    const txtRefs          = useRef({});
    const blurRefs         = useRef({});
    const ovRefs           = useRef({});
    const stkRefs          = useRef({});
    const videoLayerElsRef = useRef({});   // HTMLVideoElement instances for PIP layers
    const bgAudioElsRef    = useRef({});   // HTMLAudioElement instances for preview
    const cropRef          = useRef(null);
    const imgCacheRef      = useRef({});
    const audioCtxRef      = useRef(null);
    const videoSourceNode  = useRef(null);
    const bgAudioSourceNodes = useRef({});
    const dragRef          = useRef(null);
    const animRef          = useRef(null);
    const trimDragRef      = useRef(null);
    const layerDragRef     = useRef(null);
    const layerAnimRef     = useRef(null);
    const historyRef       = useRef([]);
    const exportingRef     = useRef(false);

    // ── State ────────────────────────────────────────────────────────────────
    const [videoSrc,       setVideoSrc]       = useState(null);
    const [videoFile,      setVideoFile]      = useState(null);
    const [duration,       setDuration]       = useState(0);
    const [currentTime,    setCurrentTime]    = useState(0);
    const [trimStart,      setTrimStart]      = useState(0);
    const [trimEnd,        setTrimEnd]        = useState(0);
    const [playing,        setPlaying]        = useState(false);
    const [texts,          setTexts]          = useState([]);
    const [stickers,       setStickers]       = useState([]);
    const [videoLayers,    setVideoLayers]    = useState([]); // Picture-in-Picture PIP video layers
    const [blurs,          setBlurs]          = useState([]);
    const [overlays,       setOverlays]       = useState([]);
    const [audios,         setAudios]         = useState([]); // BGM audio layers
    const [markers,        setMarkers]        = useState([]); // [{ id, time, label, color }]
    const [videoVolume,    setVideoVolume]    = useState(1);  // 0 - 2 (allows 200% boost)
    const [blurPx,         setBlurPx]         = useState(14);
    const [selectedId,     setSelectedId]     = useState(null);
    const [selectedKind,   setSelectedKind]   = useState(null);
    const [activeTab,      setActiveTab]      = useState('text');
    const [snapX,          setSnapX]          = useState(false);
    const [snapY,          setSnapY]          = useState(false);
    const [timelineSnapTime, setTimelineSnapTime] = useState(null);
    const [progress,       setProgress]       = useState(0);
    const [ovColor,        setOvColor]        = useState('#3b82f6');
    const [ovOpacity,      setOvOpacity]      = useState(0.55);
    const [cropEnabled,    setCropEnabled]    = useState(false);
    const [cropBox,        setCropBox]        = useState({ x: 15, y: 15, w: 70, h: 70 });
    const [aspect,         setAspect]         = useState('9:16');
    const [exportFormat,   setExportFormat]   = useState('mp4'); // 'mp4' | 'webm'
    const [exporting,      setExporting]      = useState(false);
    const [extractingAudio,setExtractingAudio]= useState(false);
    const [isFullscreen,   setIsFullscreen]   = useState(false);
    const [fsControlsVisible, setFsControlsVisible] = useState(true);
    const fsHideTimeoutRef = useRef(null);
    const [toast,          setToast]          = useState(null);
    const [textInput,      setTextInput]      = useState('ClipLite V3');
    const [stickerInput,   setStickerInput]   = useState('🔥');
    const [dragHandle,     setDragHandle]     = useState(null);
    const [muted,          setMuted]          = useState(false);

    // ── Derived ──────────────────────────────────────────────────────────────
    const trimDuration   = Math.max(0.001, trimEnd - trimStart);
    const selectedText   = texts.find(t => t.id === selectedId);
    const selectedSticker= stickers.find(s => s.id === selectedId);
    const selectedVLayer = videoLayers.find(v => v.id === selectedId);
    const selectedBlur   = blurs.find(b => b.id === selectedId);
    const selectedOv     = overlays.find(o => o.id === selectedId);
    const selectedAudio  = audios.find(a => a.id === selectedId);


    // ── Helpers ──────────────────────────────────────────────────────────────
    const fmt = (t) => {
      if (!isFinite(t)) return '00:00';
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      const d = Math.floor((t % 1) * 10);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`;
    };

    const getOutputSize = useCallback((ratio) => {
      const v = videoRef.current;
      const vw = v && v.videoWidth ? v.videoWidth : 1920;
      const vh = v && v.videoHeight ? v.videoHeight : 1080;

      if (cropEnabled && ratio === 'free') {
        const cw = Math.max(10, (cropBox.w / 100) * vw);
        const ch = Math.max(10, (cropBox.h / 100) * vh);
        const scale = Math.min(1920 / cw, 1920 / ch, 2);
        const w = Math.round((cw * scale) / 2) * 2;
        const h = Math.round((ch * scale) / 2) * 2;
        return { w: Math.max(128, w), h: Math.max(128, h) };
      }

      if (ratio === '16:9') return { w: 1920, h: 1080 };
      if (ratio === '9:16') return { w: 1080, h: 1920 };
      if (ratio === '1:1')  return { w: 1080, h: 1080 };
      if (vw > vh) return { w: 1920, h: 1080 };
      return { w: 1080, h: 1920 };
    }, [cropEnabled, cropBox]);

    const showToast = useCallback((msg) => {
      setToast(msg);
      setTimeout(() => setToast(null), 2500);
    }, []);

    // ── Font & Sticker presets ───────────────────────────────────────────────
    const FONT_FAMILIES = [
      { id: 'Inter', label: 'Inter (Hiện đại)' },
      { id: 'Be Vietnam Pro', label: 'Be Vietnam Pro (Tiếng Việt)' },
      { id: 'Montserrat', label: 'Montserrat (Sang trọng)' },
      { id: 'Roboto', label: 'Roboto (Tiêu chuẩn)' },
      { id: 'Playfair Display', label: 'Playfair (Cổ điển)' },
      { id: 'Impact', label: 'Impact (Meme / Nổi bật)' },
      { id: 'Pacifico', label: 'Pacifico (Viết tay)' },
      { id: 'Arial', label: 'Arial' },
      { id: 'Courier New', label: 'Courier New (Typewriter)' },
    ];

    const STICKER_PRESETS = [
      { cat: 'Biểu cảm', items: ['🔥', '❤️', '😂', '😍', '👏', '🎉', '💯', '👍', '🥰', '🤩', '⚡', '✨'] },
      { cat: 'Hành động / CTA', items: ['🔔', '🚀', '⭐', '💡', '💥', '🎯', '📢', '🛒', '💰', '🎁', '👀', '📌'] },
      { cat: 'Chỉ dẫn / Mũi tên', items: ['👉', '👇', '👆', '👈', '➡️', '⬅️', '⬆️', '⬇️', '↗️', '↘️'] },
      { cat: 'Trạng thái', items: ['⚠️', '❌', '✅', '👑', '🏆', '💎', '⏳', '🔒', '💬', '🎵', '🚨', '✔️'] },
    ];

    // Helper tính toán thuộc tính nội suy theo Keyframe & Fade In / Fade Out
    const getInterpolatedLayer = (item, t) => {
      const base = {
        x: item.xPercent !== undefined ? item.xPercent : (item.x ?? 50),
        y: item.yPercent !== undefined ? item.yPercent : (item.y ?? 50),
        scale: item.scale !== undefined ? item.scale : 1,
        opacity: item.opacity !== undefined ? item.opacity : 1,
        rotation: item.rotation !== undefined ? item.rotation : 0,
      };

      const kfs = (item.keyframes || []).slice().sort((a, b) => a.time - b.time);
      let cur = { ...base };

      if (kfs.length === 1) {
        cur.x = kfs[0].x ?? cur.x;
        cur.y = kfs[0].y ?? cur.y;
        cur.scale = kfs[0].scale ?? cur.scale;
        cur.opacity = kfs[0].opacity ?? cur.opacity;
        cur.rotation = kfs[0].rotation ?? cur.rotation;
      } else if (kfs.length > 1) {
        if (t <= kfs[0].time) {
          cur.x = kfs[0].x ?? cur.x;
          cur.y = kfs[0].y ?? cur.y;
          cur.scale = kfs[0].scale ?? cur.scale;
          cur.opacity = kfs[0].opacity ?? cur.opacity;
          cur.rotation = kfs[0].rotation ?? cur.rotation;
        } else if (t >= kfs[kfs.length - 1].time) {
          const last = kfs[kfs.length - 1];
          cur.x = last.x ?? cur.x;
          cur.y = last.y ?? cur.y;
          cur.scale = last.scale ?? cur.scale;
          cur.opacity = last.opacity ?? cur.opacity;
          cur.rotation = last.rotation ?? cur.rotation;
        } else {
          for (let i = 0; i < kfs.length - 1; i++) {
            const k1 = kfs[i], k2 = kfs[i + 1];
            if (t >= k1.time && t <= k2.time) {
              const frac = (t - k1.time) / Math.max(0.0001, k2.time - k1.time);
              const lerp = (a, b) => (a ?? 0) + ((b ?? 0) - (a ?? 0)) * frac;
              cur.x = lerp(k1.x ?? cur.x, k2.x ?? cur.x);
              cur.y = lerp(k1.y ?? cur.y, k2.y ?? cur.y);
              cur.scale = lerp(k1.scale ?? 1, k2.scale ?? 1);
              cur.opacity = lerp(k1.opacity ?? 1, k2.opacity ?? 1);
              cur.rotation = lerp(k1.rotation ?? 0, k2.rotation ?? 0);
              break;
            }
          }
        }
      }

      // Tính hiệu ứng Rõ dần (Fade In) & Mờ dần (Fade Out)
      let effectiveOpacity = cur.opacity;
      const fadeIn = item.fadeIn || 0;
      const fadeOut = item.fadeOut || 0;
      if (fadeIn > 0 && t >= item.start && t < item.start + fadeIn) {
        effectiveOpacity *= Math.max(0, Math.min(1, (t - item.start) / fadeIn));
      }
      if (fadeOut > 0 && t <= item.end && t > item.end - fadeOut) {
        effectiveOpacity *= Math.max(0, Math.min(1, (item.end - t) / fadeOut));
      }

      cur.effectiveOpacity = Math.max(0, Math.min(1, effectiveOpacity));
      return cur;
    };

    // ── Undo ─────────────────────────────────────────────────────────────────
    const pushHistory = useCallback(() => {
      historyRef.current.push({
        texts: texts.map(t => ({...t, keyframes: t.keyframes ? [...t.keyframes] : [] })),
        stickers: stickers.map(s => ({...s, keyframes: s.keyframes ? [...s.keyframes] : [] })),
        videoLayers: videoLayers.map(v => ({...v, keyframes: v.keyframes ? [...v.keyframes] : [] })),
        blurs: blurs.map(b => ({...b})),
        overlays: overlays.map(o => ({...o, keyframes: o.keyframes ? [...o.keyframes] : [] })),
        audios: audios.map(a => ({...a})),
        markers: markers.map(m => ({...m})),
        cropBox: {...cropBox},
        cropEnabled,
        videoVolume,
      });
      if (historyRef.current.length > 20) historyRef.current.shift();
    }, [texts, stickers, videoLayers, blurs, overlays, audios, markers, cropBox, cropEnabled, videoVolume]);

    // ── Layer items for timeline ─────────────────────────────────────────────
    const layerItems = useMemo(() => {
      const arr = [];
      texts.forEach(t => arr.push({ id: t.id, kind: 'text', label: (t.content.slice(0,18) || 'Text'), color: '#a855f7', start: t.start, end: t.end, keyframes: t.keyframes }));
      stickers.forEach(s => arr.push({ id: s.id, kind: 'sticker', label: '🏷️ ' + (s.content || 'Sticker'), color: '#f97316', start: s.start, end: s.end, keyframes: s.keyframes }));
      videoLayers.forEach(v => arr.push({ id: v.id, kind: 'vlayer', label: '🎬 ' + (v.name.slice(0,16) || 'Video'), color: '#06b6d4', start: v.start, end: v.end, keyframes: v.keyframes }));
      blurs.forEach(b => arr.push({ id: b.id, kind: 'blur', label: 'Blur', color: '#eab308', start: b.start, end: b.end }));
      overlays.forEach(o => arr.push({ id: o.id, kind: 'overlay', label: o.type === 'image' ? 'Img phủ' : 'Màu phủ', color: '#3b82f6', start: o.start, end: o.end, keyframes: o.keyframes }));
      audios.forEach(a => arr.push({ id: a.id, kind: 'audio', label: '🎵 ' + (a.name.slice(0,16) || 'Nhạc'), color: '#10b981', start: a.start, end: a.end }));
      return arr.sort((a, b) => a.start - b.start);
    }, [texts, stickers, videoLayers, blurs, overlays, audios]);

    // ── Frame / Time step helper ──────────────────────────────────────────────
    const stepFrame = useCallback((forward = true, large = false) => {
      const step = large ? 1.0 : (1 / 30);
      const newT = Math.max(0, Math.min(duration || 100, currentTime + (forward ? step : -step)));
      setCurrentTime(newT);
      if (videoRef.current) {
        if (!videoRef.current.paused) videoRef.current.pause();
        videoRef.current.currentTime = newT;
      }
    }, [duration, currentTime]);

    // ── Trim In / Out Handlers ────────────────────────────────────────────────
    const setTrimInAtPlayhead = useCallback(() => {
      const v = videoRef.current;
      const t = v ? v.currentTime : currentTime;
      if (t >= trimEnd - 0.1) {
        showToast('Điểm đầu phải trước điểm cuối ít nhất 0.1s');
        return;
      }
      setTrimStart(t);
      showToast(`Đã đặt điểm đầu: ${fmt(t)} (Thời lượng xuất: ${(trimEnd - t).toFixed(1)}s)`);
    }, [currentTime, trimEnd, showToast]);

    const setTrimOutAtPlayhead = useCallback(() => {
      const v = videoRef.current;
      const t = v ? v.currentTime : currentTime;
      if (t <= trimStart + 0.1) {
        showToast('Điểm cuối phải sau điểm đầu ít nhất 0.1s');
        return;
      }
      setTrimEnd(t);
      showToast(`Đã đặt điểm cuối: ${fmt(t)} (Thời lượng xuất: ${(t - trimStart).toFixed(1)}s)`);
    }, [currentTime, trimStart, showToast]);

    const resetTrimFull = useCallback(() => {
      setTrimStart(0);
      setTrimEnd(duration);
      showToast(`Đã khôi phục toàn bộ video (${duration.toFixed(1)}s)`);
    }, [duration, showToast]);

    // ── Keyframe Handlers ─────────────────────────────────────────────────────
    const toggleKeyframe = useCallback((item, kind) => {
      if (!item) return;
      pushHistory();
      const kfs = (item.keyframes || []).slice();
      const curKfIdx = kfs.findIndex(k => Math.abs(k.time - currentTime) < 0.1);
      const curProps = getInterpolatedLayer(item, currentTime);

      let nextKfs = [];
      if (curKfIdx !== -1) {
        nextKfs = kfs.filter((_, idx) => idx !== curKfIdx);
        showToast(`Đã xóa Keyframe tại ${fmt(currentTime)}`);
      } else {
        const newKf = {
          time: currentTime,
          x: curProps.x,
          y: curProps.y,
          scale: curProps.scale,
          rotation: curProps.rotation,
          opacity: curProps.opacity,
        };
        nextKfs = [...kfs, newKf].sort((a, b) => a.time - b.time);
        showToast(`🔷 Đã thêm Keyframe tại ${fmt(currentTime)}`);
      }

      if (kind === 'text') setTexts(ts => ts.map(t => t.id === item.id ? { ...t, keyframes: nextKfs } : t));
      else if (kind === 'sticker') setStickers(ss => ss.map(s => s.id === item.id ? { ...s, keyframes: nextKfs } : s));
      else if (kind === 'vlayer')  setVideoLayers(vs => vs.map(v => v.id === item.id ? { ...v, keyframes: nextKfs } : v));
      else if (kind === 'overlay') setOverlays(os => os.map(o => o.id === item.id ? { ...o, keyframes: nextKfs } : o));
    }, [currentTime, pushHistory, showToast]);

    const jumpKeyframe = useCallback((item, kind, dir) => {
      if (!item || !item.keyframes || item.keyframes.length === 0) return;
      const kfs = item.keyframes.slice().sort((a, b) => a.time - b.time);
      if (dir < 0) {
        const prev = [...kfs].reverse().find(k => k.time < currentTime - 0.05);
        if (prev) {
          setCurrentTime(prev.time);
          if (videoRef.current) videoRef.current.currentTime = prev.time;
        }
      } else {
        const next = kfs.find(k => k.time > currentTime + 0.05);
        if (next) {
          setCurrentTime(next.time);
          if (videoRef.current) videoRef.current.currentTime = next.time;
        }
      }
    }, [currentTime]);

    const updateLayerProp = useCallback((item, kind, prop, val) => {
      if (!item) return;
      pushHistory();
      const kfs = (item.keyframes || []).slice();
      const curKfIdx = kfs.findIndex(k => Math.abs(k.time - currentTime) < 0.1);

      if (curKfIdx !== -1) {
        const nextKfs = [...kfs];
        nextKfs[curKfIdx] = { ...nextKfs[curKfIdx], [prop]: val };
        if (kind === 'text') setTexts(ts => ts.map(t => t.id === item.id ? { ...t, keyframes: nextKfs } : t));
        else if (kind === 'sticker') setStickers(ss => ss.map(s => s.id === item.id ? { ...s, keyframes: nextKfs } : s));
        else if (kind === 'vlayer')  setVideoLayers(vs => vs.map(v => v.id === item.id ? { ...v, keyframes: nextKfs } : v));
        else if (kind === 'overlay') setOverlays(os => os.map(o => o.id === item.id ? { ...o, keyframes: nextKfs } : o));
      } else {
        if (kind === 'text') setTexts(ts => ts.map(t => t.id === item.id ? { ...t, [prop]: val } : t));
        else if (kind === 'sticker') setStickers(ss => ss.map(s => s.id === item.id ? { ...s, [prop]: val } : s));
        else if (kind === 'vlayer')  setVideoLayers(vs => vs.map(v => v.id === item.id ? { ...v, [prop]: val } : v));
        else if (kind === 'overlay') setOverlays(os => os.map(o => o.id === item.id ? { ...o, [prop]: val } : o));
      }
    }, [currentTime, pushHistory]);

    const updateLayerDirect = useCallback((item, kind, prop, val) => {
      if (!item) return;
      if (kind === 'text') setTexts(ts => ts.map(t => t.id === item.id ? { ...t, [prop]: val } : t));
      else if (kind === 'sticker') setStickers(ss => ss.map(s => s.id === item.id ? { ...s, [prop]: val } : s));
      else if (kind === 'vlayer')  setVideoLayers(vs => vs.map(v => v.id === item.id ? { ...v, [prop]: val } : v));
      else if (kind === 'overlay') setOverlays(os => os.map(o => o.id === item.id ? { ...o, [prop]: val } : o));
    }, []);

    // ── Marker Handlers ───────────────────────────────────────────────────────
    const addMarkerAtCurrentTime = useCallback(() => {
      pushHistory();
      const id = 'm_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 3);
      const newMarker = {
        id,
        time: currentTime,
        label: `Mốc ${markers.length + 1}`,
        color: '#ec4899',
      };
      setMarkers(ms => [...ms, newMarker].sort((a, b) => a.time - b.time));
      showToast(`📍 Đã đánh dấu tại ${fmt(currentTime)} (Phím M)`);
    }, [currentTime, markers, pushHistory, showToast]);

    const deleteMarker = useCallback((id) => {
      pushHistory();
      setMarkers(ms => ms.filter(m => m.id !== id));
      showToast('Đã xóa mốc đánh dấu');
    }, [pushHistory, showToast]);

    // ── Sticker Handlers ──────────────────────────────────────────────────────
    const addSticker = useCallback((emoji) => {
      const content = emoji || stickerInput || '🔥';
      const id = 'stk_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
      pushHistory();
      const newStk = {
        id,
        content,
        xPercent: 50,
        yPercent: 50,
        size: 56,
        scale: 1,
        rotation: 0,
        opacity: 1,
        fadeIn: 0.3,
        fadeOut: 0.3,
        keyframes: [],
        start: trimStart,
        end: trimEnd || duration || 5,
      };
      setStickers(ss => [...ss, newStk]);
      setSelectedId(id);
      setSelectedKind('sticker');
      setActiveTab('sticker');
      showToast(`Đã thêm nhãn dán: ${content}`);
    }, [stickerInput, trimStart, trimEnd, duration, pushHistory, showToast]);

    // ── Video Layer (PIP) Handlers ───────────────────────────────────────────
    const onVideoLayerInput = useCallback((e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const src = URL.createObjectURL(file);
      const tempV = document.createElement('video');
      tempV.src = src;
      tempV.onloadedmetadata = () => {
        const vDur = tempV.duration || 5;
        const vw = tempV.videoWidth || 16;
        const vh = tempV.videoHeight || 9;
        const ar = vw / vh;
        const id = 'vlayer_' + Date.now();
        pushHistory();
        const newVLayer = {
          id,
          name: file.name.replace(/\.[^/.]+$/, ""),
          src,
          fileDuration: vDur,
          aspectRatio: ar,
          xPercent: 50,
          yPercent: 50,
          widthPercent: 35,
          scale: 1,
          rotation: 0,
          opacity: 1,
          volume: 1.0,
          muted: false,
          fadeIn: 0.3,
          fadeOut: 0.3,
          keyframes: [],
          start: currentTime,
          end: Math.min(trimEnd || duration || (currentTime + vDur), currentTime + vDur),
          offset: 0,
        };
        setVideoLayers(vl => [...vl, newVLayer]);
        setSelectedId(id);
        setSelectedKind('vlayer');
        setActiveTab('vlayer');
        showToast('Đã thêm Layer Video: ' + newVLayer.name);
      };
      e.target.value = '';
    }, [currentTime, trimEnd, duration, pushHistory, showToast]);

    const removeVideoLayer = useCallback((id) => {
      const vl = videoLayers.find(v => v.id === id);
      if (vl?.src) URL.revokeObjectURL(vl.src);
      if (videoLayerElsRef.current[id]) {
        videoLayerElsRef.current[id].pause();
        delete videoLayerElsRef.current[id];
      }
      pushHistory();
      setVideoLayers(vls => vls.filter(v => v.id !== id));
      if (selectedId === id) { setSelectedId(null); setSelectedKind(null); }
      showToast('Đã xóa layer video');
    }, [videoLayers, selectedId, pushHistory, showToast]);

    // ── Split at Playhead ────────────────────────────────────────────────────
    const splitAtCurrentTime = useCallback(() => {
      if (duration === 0) return;

      let targetId = selectedId;
      let targetKind = selectedKind;

      if (!targetId) {
        const candidate = layerItems.find(item => currentTime > item.start + 0.05 && currentTime < item.end - 0.05);
        if (candidate) {
          targetId = candidate.id;
          targetKind = candidate.kind;
        }
      }

      if (!targetId) {
        showToast('Vui lòng chọn một lớp (chữ, nhãn dán, video, nhạc, phủ, mờ) để tách tại con trỏ');
        return;
      }

      pushHistory();
      const newId = 'split_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);

      if (targetKind === 'text') {
        const item = texts.find(t => t.id === targetId);
        if (!item || currentTime <= item.start + 0.05 || currentTime >= item.end - 0.05) {
          showToast('Con trỏ phải nằm trong phạm vi lớp chữ để tách');
          return;
        }
        const part1 = { ...item, end: currentTime };
        const part2 = { ...item, id: newId, start: currentTime };
        setTexts(ts => {
          const idx = ts.findIndex(t => t.id === targetId);
          if (idx === -1) return ts;
          const next = [...ts];
          next.splice(idx, 1, part1, part2);
          return next;
        });
        setSelectedId(newId);
        setSelectedKind('text');
        showToast(`Đã tách chữ tại ${fmt(currentTime)}`);
      } else if (targetKind === 'sticker') {
        const item = stickers.find(s => s.id === targetId);
        if (!item || currentTime <= item.start + 0.05 || currentTime >= item.end - 0.05) {
          showToast('Con trỏ phải nằm trong phạm vi nhãn dán để tách');
          return;
        }
        const part1 = { ...item, end: currentTime };
        const part2 = { ...item, id: newId, start: currentTime };
        setStickers(ss => {
          const idx = ss.findIndex(s => s.id === targetId);
          if (idx === -1) return ss;
          const next = [...ss];
          next.splice(idx, 1, part1, part2);
          return next;
        });
        setSelectedId(newId);
        setSelectedKind('sticker');
        showToast(`Đã tách nhãn dán tại ${fmt(currentTime)}`);
      } else if (targetKind === 'vlayer') {
        const item = videoLayers.find(v => v.id === targetId);
        if (!item || currentTime <= item.start + 0.05 || currentTime >= item.end - 0.05) {
          showToast('Con trỏ phải nằm trong phạm vi Layer Video để tách');
          return;
        }
        const splitOffset = currentTime - item.start;
        const part1 = { ...item, end: currentTime };
        const part2 = {
          ...item,
          id: newId,
          start: currentTime,
          offset: (item.offset || 0) + splitOffset,
        };
        setVideoLayers(vs => {
          const idx = vs.findIndex(v => v.id === targetId);
          if (idx === -1) return vs;
          const next = [...vs];
          next.splice(idx, 1, part1, part2);
          return next;
        });
        setSelectedId(newId);
        setSelectedKind('vlayer');
        showToast(`Đã tách Layer Video tại ${fmt(currentTime)}`);
      } else if (targetKind === 'audio') {
        const item = audios.find(a => a.id === targetId);
        if (!item || currentTime <= item.start + 0.05 || currentTime >= item.end - 0.05) {
          showToast('Con trỏ phải nằm trong phạm vi bài nhạc để tách');
          return;
        }
        const splitOffset = currentTime - item.start;
        const part1 = { ...item, end: currentTime };
        const part2 = {
          ...item,
          id: newId,
          start: currentTime,
          offset: (item.offset || 0) + splitOffset
        };
        setAudios(as => {
          const idx = as.findIndex(a => a.id === targetId);
          if (idx === -1) return as;
          const next = [...as];
          next.splice(idx, 1, part1, part2);
          return next;
        });
        setSelectedId(newId);
        setSelectedKind('audio');
        showToast(`Đã tách nhạc tại ${fmt(currentTime)}`);
      } else if (targetKind === 'overlay') {
        const item = overlays.find(o => o.id === targetId);
        if (!item || currentTime <= item.start + 0.05 || currentTime >= item.end - 0.05) {
          showToast('Con trỏ phải nằm trong phạm vi lớp phủ để tách');
          return;
        }
        const part1 = { ...item, end: currentTime };
        const part2 = { ...item, id: newId, start: currentTime };
        if (imgCacheRef.current[targetId]) {
          imgCacheRef.current[newId] = imgCacheRef.current[targetId];
        }
        setOverlays(os => {
          const idx = os.findIndex(o => o.id === targetId);
          if (idx === -1) return os;
          const next = [...os];
          next.splice(idx, 1, part1, part2);
          return next;
        });
        setSelectedId(newId);
        setSelectedKind('overlay');
        showToast(`Đã tách lớp phủ tại ${fmt(currentTime)}`);
      } else if (targetKind === 'blur') {
        const item = blurs.find(b => b.id === targetId);
        if (!item || currentTime <= item.start + 0.05 || currentTime >= item.end - 0.05) {
          showToast('Con trỏ phải nằm trong phạm vi vùng mờ để tách');
          return;
        }
        const part1 = { ...item, end: currentTime };
        const part2 = { ...item, id: newId, start: currentTime };
        setBlurs(bs => {
          const idx = bs.findIndex(b => b.id === targetId);
          if (idx === -1) return bs;
          const next = [...bs];
          next.splice(idx, 1, part1, part2);
          return next;
        });
        setSelectedId(newId);
        setSelectedKind('blur');
        showToast(`Đã tách vùng mờ tại ${fmt(currentTime)}`);
      }
    }, [duration, selectedId, selectedKind, currentTime, layerItems, texts, stickers, videoLayers, audios, overlays, blurs, pushHistory, showToast]);

    // ── Sync overlay container size to video ─────────────────────────────────
    const syncSize = useCallback(() => {
      if (isFullscreen) return;
      const v = videoRef.current;
      const o = overlayRef.current;
      const c = containerRef.current;
      if (!v || !o || !c) return;
      c.style.position = 'relative';
      c.style.left = '0px';
      c.style.top = '0px';
      const r = v.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) return;
      o.style.width  = r.width  + 'px';
      o.style.height = r.height + 'px';
      c.style.width  = r.width  + 'px';
      c.style.height = r.height + 'px';
    }, [isFullscreen]);

    // ── Audio & Video Layer Preview Synchronization ───────────────────────────
    useEffect(() => {
      // Sync background audios with video currentTime and playback state
      audios.forEach(aud => {
        let el = bgAudioElsRef.current[aud.id];
        if (!el) {
          el = new Audio(aud.src);
          el.preload = 'auto';
          bgAudioElsRef.current[aud.id] = el;
        }
        el.volume = muted ? 0 : Math.min(1, aud.volume ?? 1);

        const shouldPlay = playing && currentTime >= aud.start && currentTime <= aud.end;
        if (shouldPlay) {
          const targetOffset = Math.max(0, (currentTime - aud.start) + (aud.offset || 0));
          if (Math.abs(el.currentTime - targetOffset) > 0.15) {
            el.currentTime = targetOffset;
          }
          if (el.paused) el.play().catch(() => {});
        } else {
          if (!el.paused) el.pause();
        }
      });

      // Sync PIP video layers
      videoLayers.forEach(vl => {
        const el = videoLayerElsRef.current[vl.id];
        if (!el) return;
        el.volume = (muted || vl.muted) ? 0 : Math.min(1, vl.volume ?? 1);
        const inRange = currentTime >= vl.start && currentTime <= vl.end;
        if (inRange) {
          const targetOffset = Math.max(0, (currentTime - vl.start) + (vl.offset || 0));
          if (Math.abs(el.currentTime - targetOffset) > 0.15) {
            el.currentTime = targetOffset;
          }
          if (playing && el.paused) {
            el.play().catch(() => {});
          } else if (!playing && !el.paused) {
            el.pause();
          }
        } else {
          if (!el.paused) el.pause();
        }
      });

      // Sync main video volume & mute
      if (videoRef.current) {
        videoRef.current.muted = muted;
        videoRef.current.volume = muted ? 0 : Math.min(1, Math.max(0, videoVolume));
      }
    }, [currentTime, playing, audios, videoLayers, muted, videoVolume]);

    // ── Effects ──────────────────────────────────────────────────────────────
    useEffect(() => {
      const ro = new ResizeObserver(syncSize);
      if (wrapRef.current)  ro.observe(wrapRef.current);
      if (videoRef.current) ro.observe(videoRef.current);
      window.addEventListener('resize', syncSize);
      return () => { ro.disconnect(); window.removeEventListener('resize', syncSize); };
    }, [videoSrc, syncSize]);

    // Keyboard shortcuts
    useEffect(() => {
      const onKey = (e) => {
        const tag = document.activeElement?.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          stepFrame(false, e.shiftKey);
          return;
        }

        if (e.key === 'ArrowRight') {
          e.preventDefault();
          stepFrame(true, e.shiftKey);
          return;
        }

        if (e.key === 's' || e.key === 'S') {
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            splitAtCurrentTime();
            return;
          }
        }

        if (e.key === '[') {
          e.preventDefault();
          setTrimInAtPlayhead();
          return;
        }

        if (e.key === ']') {
          e.preventDefault();
          setTrimOutAtPlayhead();
          return;
        }

        if (e.key === 'm' || e.key === 'M') {
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            addMarkerAtCurrentTime();
            return;
          }
        }

        if (e.key === ' ') {
          e.preventDefault();
          if (videoRef.current) {
            videoRef.current.paused ? videoRef.current.play() : videoRef.current.pause();
          }
          return;
        }

        if (e.key === 'Delete' && selectedId) {
          pushHistory();
          if (selectedKind === 'text')    setTexts(ts => ts.filter(t => t.id !== selectedId));
          if (selectedKind === 'sticker') setStickers(ss => ss.filter(s => s.id !== selectedId));
          if (selectedKind === 'vlayer')  removeVideoLayer(selectedId);
          if (selectedKind === 'blur')    setBlurs(bs => bs.filter(b => b.id !== selectedId));
          if (selectedKind === 'overlay') {
            const ov = overlays.find(o => o.id === selectedId);
            if (ov?.src) { URL.revokeObjectURL(ov.src); delete imgCacheRef.current[ov.id]; }
            setOverlays(os => os.filter(o => o.id !== selectedId));
          }
          if (selectedKind === 'audio') {
            const a = audios.find(x => x.id === selectedId);
            if (a?.src) URL.revokeObjectURL(a.src);
            if (bgAudioElsRef.current[selectedId]) {
              bgAudioElsRef.current[selectedId].pause();
              delete bgAudioElsRef.current[selectedId];
            }
            setAudios(as => as.filter(x => x.id !== selectedId));
          }
          setSelectedId(null); setSelectedKind(null);
        }

        if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
          e.preventDefault();
          const snap = historyRef.current.pop();
          if (snap) {
            setTexts(snap.texts);
            if (snap.stickers) setStickers(snap.stickers);
            if (snap.videoLayers) setVideoLayers(snap.videoLayers);
            setBlurs(snap.blurs);
            setOverlays(snap.overlays);
            if (snap.audios) setAudios(snap.audios);
            if (snap.markers) setMarkers(snap.markers);
            if (snap.videoVolume !== undefined) setVideoVolume(snap.videoVolume);
            setCropBox(snap.cropBox); setCropEnabled(snap.cropEnabled);
            showToast('Đã hoàn tác');
          }
        }

        if (e.key === 'Escape' && isFullscreen) {
          e.preventDefault();
          if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
          setIsFullscreen(false);
          return;
        }
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [selectedId, selectedKind, overlays, audios, isFullscreen, pushHistory, showToast, stepFrame, splitAtCurrentTime, currentTime, duration, setTrimInAtPlayhead, setTrimOutAtPlayhead, addMarkerAtCurrentTime]);

    // Fullscreen auto-hide timer
    const resetFsControlsTimer = useCallback(() => {
      setFsControlsVisible(true);
      if (fsHideTimeoutRef.current) clearTimeout(fsHideTimeoutRef.current);
      if (isFullscreen && playing) {
        fsHideTimeoutRef.current = setTimeout(() => {
          setFsControlsVisible(false);
        }, 2800);
      }
    }, [isFullscreen, playing]);

    useEffect(() => {
      if (!isFullscreen) {
        setFsControlsVisible(true);
        if (fsHideTimeoutRef.current) clearTimeout(fsHideTimeoutRef.current);
        return;
      }
      resetFsControlsTimer();
      const onActivity = () => resetFsControlsTimer();
      window.addEventListener('mousemove', onActivity);
      window.addEventListener('pointerdown', onActivity);
      window.addEventListener('keydown', onActivity);
      return () => {
        window.removeEventListener('mousemove', onActivity);
        window.removeEventListener('pointerdown', onActivity);
        window.removeEventListener('keydown', onActivity);
        if (fsHideTimeoutRef.current) clearTimeout(fsHideTimeoutRef.current);
      };
    }, [isFullscreen, resetFsControlsTimer]);

    useEffect(() => {
      const fn = () => {
        const fs = !!document.fullscreenElement;
        setIsFullscreen(fs);
        if (!fs) {
          setTimeout(syncSize, 80);
        } else {
          if (containerRef.current) {
            containerRef.current.style.width = '';
            containerRef.current.style.height = '';
          }
          if (overlayRef.current) {
            overlayRef.current.style.width = '';
            overlayRef.current.style.height = '';
          }
        }
      };
      document.addEventListener('fullscreenchange', fn);
      return () => document.removeEventListener('fullscreenchange', fn);
    }, [syncSize]);

    useEffect(() => {
      overlays.forEach(ov => {
        if (ov.type === 'image' && ov.src && !imgCacheRef.current[ov.id]) {
          const img = new Image();
          img.onload = () => { imgCacheRef.current[ov.id] = img; };
          img.src = ov.src;
        }
      });
    }, [overlays]);

    useEffect(() => {
      if (exportingRef.current) return;
      const v = videoRef.current;
      if (!v || duration === 0) return;
      if (currentTime < trimStart - 0.01 || currentTime > trimEnd + 0.01) {
        v.currentTime = trimStart;
        setCurrentTime(trimStart);
      }
    }, [trimStart, trimEnd, duration]);

    // ── Video input ───────────────────────────────────────────────────────────
    const onVideoInput = useCallback((e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      if (videoSrc) URL.revokeObjectURL(videoSrc);
      const url = URL.createObjectURL(file);
      setVideoFile(file);
      setVideoSrc(url);
      setPlaying(false);

      // Nếu trước đó chưa nạp video nào (vừa mở file dự án), giữ nguyên các lớp của dự án!
      if (videoSrc) {
        setTrimStart(0); setTrimEnd(0);
        setCurrentTime(0);
        setTexts([]); setBlurs([]);
        videoLayers.forEach(v => { if (v.src) URL.revokeObjectURL(v.src); });
        Object.values(videoLayerElsRef.current).forEach(el => el.pause());
        videoLayerElsRef.current = {};
        setVideoLayers([]);
        overlays.forEach(ov => { if (ov.src) URL.revokeObjectURL(ov.src); });
        imgCacheRef.current = {};
        setOverlays([]);
        audios.forEach(a => { if (a.src) URL.revokeObjectURL(a.src); });
        Object.values(bgAudioElsRef.current).forEach(el => el.pause());
        bgAudioElsRef.current = {};
        setAudios([]);
        setSelectedId(null); setSelectedKind(null);
        historyRef.current = [];
      }
      setTimeout(syncSize, 100);
      showToast('Đã nạp video: ' + file.name);
    }, [videoSrc, videoLayers, overlays, audios, syncSize, showToast]);

    // ── Audio Input (MP3, WAV, etc.) ──────────────────────────────────────────
    const onAudioInput = useCallback((e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const src = URL.createObjectURL(file);
      const tempAudio = new Audio(src);
      tempAudio.onloadedmetadata = () => {
        const audioDur = tempAudio.duration || 10;
        const id = 'aud_' + Date.now();
        pushHistory();
        const newAud = {
          id,
          name: file.name.replace(/\.[^/.]+$/, ""),
          src,
          fileDuration: audioDur,
          start: trimStart,
          end: Math.min(trimEnd || duration || audioDur, trimStart + audioDur),
          volume: 1.0,
        };
        setAudios(as => [...as, newAud]);
        setSelectedId(id);
        setSelectedKind('audio');
        setActiveTab('audio');
        showToast('Đã thêm âm thanh: ' + newAud.name);
      };
    }, [trimStart, trimEnd, duration, pushHistory, showToast]);

    const removeAudio = useCallback((id) => {
      const a = audios.find(x => x.id === id);
      if (a?.src) URL.revokeObjectURL(a.src);
      if (bgAudioElsRef.current[id]) {
        bgAudioElsRef.current[id].pause();
        delete bgAudioElsRef.current[id];
      }
      pushHistory();
      setAudios(as => as.filter(x => x.id !== id));
      if (selectedId === id) { setSelectedId(null); setSelectedKind(null); }
      showToast('Đã xóa âm thanh');
    }, [audios, selectedId, pushHistory, showToast]);

    // ── Save & Open Project (.json) ──────────────────────────────────────────
    const saveProject = useCallback(async () => {
      showToast('Đang chuẩn bị file dự án...');
      try {
        const serializedOverlays = await Promise.all(overlays.map(async (ov) => {
          const copy = { ...ov };
          if (ov.type === 'image' && ov.src && imgCacheRef.current[ov.id]) {
            try {
              const img = imgCacheRef.current[ov.id];
              const c = document.createElement('canvas');
              c.width = img.naturalWidth || 400;
              c.height = img.naturalHeight || 400;
              const ctx = c.getContext('2d');
              ctx.drawImage(img, 0, 0);
              copy.src = c.toDataURL('image/png');
            } catch (e) {
              console.warn('Could not serialize image overlay to base64', e);
            }
          }
          return copy;
        }));

        const serializedAudios = await Promise.all(audios.map(async (aud) => {
          const copy = { ...aud };
          if (aud.src && aud.src.startsWith('blob:')) {
            try {
              const resp = await fetch(aud.src);
              const blob = await resp.blob();
              if (blob.size < 25 * 1024 * 1024) {
                const reader = new FileReader();
                const dataUrl = await new Promise((res, rej) => {
                  reader.onload = () => res(reader.result);
                  reader.onerror = rej;
                  reader.readAsDataURL(blob);
                });
                copy.src = dataUrl;
              }
            } catch (e) {
              console.warn('Could not serialize audio to base64', e);
            }
          }
          return copy;
        }));

        const projectData = {
          app: 'ClipLite',
          version: '3.0',
          savedAt: new Date().toISOString(),
          videoFileName: videoFile ? videoFile.name : null,
          videoFileSize: videoFile ? videoFile.size : null,
          duration,
          trimStart,
          trimEnd,
          videoVolume,
          aspect,
          exportFormat,
          cropEnabled,
          cropBox: { ...cropBox },
          blurPx,
          texts: texts.map(t => ({ ...t })),
          stickers: stickers.map(s => ({ ...s })),
          videoLayers: videoLayers.map(v => ({ ...v })),
          blurs: blurs.map(b => ({ ...b })),
          overlays: serializedOverlays,
          audios: serializedAudios,
          markers: markers.map(m => ({ ...m })),
        };

        const jsonStr = JSON.stringify(projectData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const safeName = videoFile ? videoFile.name.replace(/\.[^/.]+$/, '') : 'du_an';
        a.href = url;
        a.download = `cliplite_project_${safeName}_${Date.now()}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        showToast('Đã lưu file dự án về máy thành công!');
      } catch (err) {
        console.error('Save project error:', err);
        alert('Lưu dự án lỗi: ' + (err?.message || err));
      }
    }, [videoFile, duration, trimStart, trimEnd, videoVolume, aspect, exportFormat, cropEnabled, cropBox, blurPx, texts, stickers, blurs, overlays, audios, markers, showToast]);

    const onOpenProject = useCallback((e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data || data.app !== 'ClipLite') {
            alert('File này không phải là định dạng dự án ClipLite hợp lệ!');
            return;
          }
          pushHistory();

          if (data.duration) setDuration(data.duration);
          if (data.trimStart !== undefined) setTrimStart(data.trimStart);
          if (data.trimEnd !== undefined) setTrimEnd(data.trimEnd);
          if (data.videoVolume !== undefined) setVideoVolume(data.videoVolume);
          if (data.aspect) setAspect(data.aspect);
          if (data.exportFormat) setExportFormat(data.exportFormat);
          if (data.cropEnabled !== undefined) setCropEnabled(data.cropEnabled);
          if (data.cropBox) setCropBox(data.cropBox);
          if (data.blurPx !== undefined) setBlurPx(data.blurPx);
          if (Array.isArray(data.texts)) setTexts(data.texts);
          if (Array.isArray(data.stickers)) setStickers(data.stickers);
          if (Array.isArray(data.videoLayers)) setVideoLayers(data.videoLayers);
          if (Array.isArray(data.blurs)) setBlurs(data.blurs);
          if (Array.isArray(data.markers)) setMarkers(data.markers);

          if (Array.isArray(data.overlays)) {
            setOverlays(data.overlays);
            data.overlays.forEach(ov => {
              if (ov.type === 'image' && ov.src) {
                const img = new Image();
                img.onload = () => { imgCacheRef.current[ov.id] = img; };
                img.src = ov.src;
              }
            });
          }

          if (Array.isArray(data.audios)) {
            setAudios(data.audios);
          }

          setSelectedId(null);
          setSelectedKind(null);

          if (data.videoFileName && (!videoFile || videoFile.name !== data.videoFileName)) {
            showToast(`Đã mở dự án! Vui lòng chọn file video "${data.videoFileName}" để xem trước.`);
          } else {
            showToast('Đã nạp lại dự án thành công!');
          }
        } catch (err) {
          console.error('Parse project error:', err);
          alert('Không thể đọc file dự án: ' + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }, [videoFile, pushHistory, showToast]);

    // ── Tách âm thanh từ video (Extract Audio to WAV) ─────────────────────────
    const extractAudioFromVideo = useCallback(async (onlyTrim = false) => {
      if (!videoSrc) { alert('Vui lòng nhập video trước'); return; }
      setExtractingAudio(true);
      showToast('Đang trích xuất âm thanh từ video...');
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const actx = new AudioCtx();
        const resp = await fetch(videoSrc);
        const arrayBuffer = await resp.arrayBuffer();
        const decodedBuffer = await actx.decodeAudioData(arrayBuffer);

        const startSec = onlyTrim ? trimStart : 0;
        const durSec = onlyTrim ? (trimEnd - trimStart) : decodedBuffer.duration;
        const wavBlob = audioBufferToWav(decodedBuffer, startSec, durSec);

        const url = URL.createObjectURL(wavBlob);
        const a = document.createElement('a');
        a.href = url;
        const suffix = onlyTrim ? `_trim_${trimStart.toFixed(1)}s-${trimEnd.toFixed(1)}s` : '_full';
        a.download = `audio_${(videoFile?.name || 'video').replace(/\.[^/.]+$/, "")}${suffix}.wav`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        showToast('✅ Đã tách và tải âm thanh thành công (.wav)!');
      } catch (err) {
        console.error(err);
        alert('Lỗi tách âm thanh: ' + (err?.message || err));
      } finally {
        setExtractingAudio(false);
      }
    }, [videoSrc, videoFile, trimStart, trimEnd, showToast]);

    const removeOverlay = useCallback((id) => {
      const ov = overlays.find(o => o.id === id);
      if (ov?.src) { URL.revokeObjectURL(ov.src); delete imgCacheRef.current[id]; }
      pushHistory();
      setOverlays(os => os.filter(o => o.id !== id));
      if (selectedId === id) { setSelectedId(null); setSelectedKind(null); }
    }, [overlays, selectedId, pushHistory]);

    const onImageInput = useCallback((e) => {
      const file = e.target.files?.[0];

    const addColorOverlay = useCallback(() => {

    const addText = useCallback(() => {
      if (!textInput.trim()) return;
      const id = 'txt_' + Date.now();
      pushHistory();
      setTexts(ts => [...ts, {
        id,
        content: textInput,

    const addBlur = useCallback(() => {
      const id = 'blur_' + Date.now();
      pushHistory();
      setBlurs(bs => [...bs, {
        id,
        x: 30,
        y: 30,
        w: 30,
